[package]
name = "niri-ipc"
version.workspace = true
authors.workspace = true
license.workspace = true
edition.workspace = true
repository.workspace = true

description = "Types and helpers for interfacing with the niri Wayland compositor."
keywords = ["wayland"]
categories = ["api-bindings", "os"]
readme = "README.md"

[dependencies]
clap = { workspace = true, optional = true }
clap_complete = { workspace = true, features = ["unstable-dynamic"], optional = true }
schemars = { version = "1.2.2", optional = true }
serde.workspace = true
serde_json.workspace = true

[features]
clap = ["dep:clap", "dep:clap_complete"]
json-schema = ["dep:schemars"]

[lints]
# Do not inherit from workspace.
